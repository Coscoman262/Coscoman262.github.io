<!DOCTYPE html>
<html>
<head>
  <title>My Games</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
    }

    h1 {
      padding: 30px;
    }

    .games {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .card {
      background: #222;
      width: 250px;
      padding: 20px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
      background: #333;
    }
  </style>
</head>

<body>

<h1>🎮 My Games Website</h1>

<div class="games">

  <a class="card" href="snake.html">
    <h2>Snake Game</h2>
    <p>Classic snake game</p>
  </a>

</div>

</body>
</html>
