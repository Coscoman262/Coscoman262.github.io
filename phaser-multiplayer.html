<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Dash Duo</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0b1118; color: #c7d5e0; text-align: center; }
    #game-wrap { max-width: 840px; margin: 10px auto; }
    #game { margin: 0 auto; display: inline-block; border: 2px solid #66c0f4; }
    .controls { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 12px auto 20px; }
    .pad { background: #1b2838; border: 1px solid #2a475e; border-radius: 10px; padding: 10px; }
    .pad h3 { margin: 0 0 8px; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; }
    button { height: 52px; border-radius: 8px; border: 1px solid #66c0f4; background: #2a475e; color: #fff; font-size: 1rem; }
    .empty { visibility: hidden; }
  </style>
</head>
<body>
  <h1>Arena Dash Duo</h1>
  <p>Player 1: WASD • Player 2: Arrow Keys • First to 5 points wins.</p>
  <div id="game-wrap"><div id="game"></div></div>

  <div class="controls">
    <div class="pad" data-player="p1">
      <h3>Player 1</h3>
      <div class="grid">
        <div class="empty"></div><button data-k="w">▲</button><div class="empty"></div>
        <button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button>
      </div>
    </div>
    <div class="pad" data-player="p2">
      <h3>Player 2</h3>
      <div class="grid">
        <div class="empty"></div><button data-k="arrowup">▲</button><div class="empty"></div>
        <button data-k="arrowleft">◀</button><button data-k="arrowdown">▼</button><button data-k="arrowright">▶</button>
      </div>
    </div>
  </div>

<script>
const inputState = { w:false,a:false,s:false,d:false,arrowup:false,arrowleft:false,arrowdown:false,arrowright:false };

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 500,
  backgroundColor: '#101822',
  parent: 'game',
  physics: { default: 'arcade', arcade: { debug: false } },
  scene: { preload, create, update }
};

const game = new Phaser.Game(config);
let p1, p2, star, scoreText;
let score1 = 0, score2 = 0;
const speed = 220;

function preload() {}

function create() {
  this.add.rectangle(400,250,800,500,0x152333);
  p1 = this.physics.add.sprite(100, 250, null).setDisplaySize(28, 28).setTint(0x66c0f4);
  p2 = this.physics.add.sprite(700, 250, null).setDisplaySize(28, 28).setTint(0xff7b7b);
  p1.body.setCollideWorldBounds(true);
  p2.body.setCollideWorldBounds(true);

  star = this.add.circle(400, 250, 10, 0xa4d007);
  this.physics.add.existing(star);
  star.body.setAllowGravity(false);

  scoreText = this.add.text(16, 12, 'P1: 0 | P2: 0', { fontSize: '24px', color: '#ffffff' });
  this.physics.add.overlap(p1, star, () => collect(this, 1));
  this.physics.add.overlap(p2, star, () => collect(this, 2));

  this.input.keyboard.on('keydown', e => setKey(e.key.toLowerCase(), true));
  this.input.keyboard.on('keyup', e => setKey(e.key.toLowerCase(), false));
}

function collect(scene, player) {
  if (player === 1) score1++; else score2++;
  scoreText.setText(`P1: ${score1} | P2: ${score2}`);
  star.x = Phaser.Math.Between(20, 780);
  star.y = Phaser.Math.Between(20, 480);
  if (score1 >= 5 || score2 >= 5) {
    const winner = score1 >= 5 ? 'Player 1' : 'Player 2';
    scene.add.text(250, 220, `${winner} wins! Tap to restart`, { fontSize: '36px', color: '#a4d007' });
    score1 = 0; score2 = 0;
    scene.input.once('pointerdown', () => scene.scene.restart());
  }
}

function update() {
  movePlayer(p1, inputState.a, inputState.d, inputState.w, inputState.s);
  movePlayer(p2, inputState.arrowleft, inputState.arrowright, inputState.arrowup, inputState.arrowdown);
}

function movePlayer(player, left, right, up, down) {
  player.setVelocity(0);
  if (left) player.setVelocityX(-speed);
  if (right) player.setVelocityX(speed);
  if (up) player.setVelocityY(-speed);
  if (down) player.setVelocityY(speed);
}

function setKey(key, value) {
  if (key in inputState) inputState[key] = value;
}

document.querySelectorAll('button[data-k]').forEach(btn => {
  const key = btn.dataset.k;
  const on = (e) => { e.preventDefault(); setKey(key, true); };
  const off = (e) => { e.preventDefault(); setKey(key, false); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('touchstart', on, { passive: false });
  btn.addEventListener('touchend', off, { passive: false });
});
</script>
</body>
</html>
