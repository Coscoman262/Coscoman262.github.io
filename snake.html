<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Reloaded</title>
  <style>
    body {
      margin: 0;
      background: #0e141b;
      color: #c7d5e0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 12px;
    }

    #game {
      background: #1b2838;
      border: 2px solid #66c0f4;
      max-width: 92vw;
      max-height: 92vw;
      width: 400px;
      height: 400px;
      touch-action: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      gap: 8px;
      user-select: none;
    }

    .btn {
      background: #2a475e;
      border: 1px solid #66c0f4;
      color: white;
      border-radius: 8px;
      height: 56px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .hint {
      font-size: 0.9rem;
      color: #8f98a0;
      text-align: center;
    }

    .empty { visibility: hidden; }
  </style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>

<div class="controls" aria-label="Touch controls">
  <div class="empty"></div>
  <button class="btn" data-dir="up">▲</button>
  <div class="empty"></div>
  <button class="btn" data-dir="left">◀</button>
  <button class="btn" data-dir="down">▼</button>
  <button class="btn" data-dir="right">▶</button>
</div>
<div class="hint">Arrow keys or touch buttons.</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;
let count = 0;

let snake = {
  x: 160,
  y: 160,
  dx: grid,
  dy: 0,
  cells: [],
  maxCells: 4
};

let apple = { x: 320, y: 320 };

function random(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

function setDirection(dir) {
  if (dir === "left" && snake.dx === 0) {
    snake.dx = -grid; snake.dy = 0;
  } else if (dir === "up" && snake.dy === 0) {
    snake.dy = -grid; snake.dx = 0;
  } else if (dir === "right" && snake.dx === 0) {
    snake.dx = grid; snake.dy = 0;
  } else if (dir === "down" && snake.dy === 0) {
    snake.dy = grid; snake.dx = 0;
  }
}

function loop() {
  requestAnimationFrame(loop);
  if (++count < 4) return;
  count = 0;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  snake.x += snake.dx;
  snake.y += snake.dy;

  if (snake.x < 0) snake.x = canvas.width - grid;
  if (snake.x >= canvas.width) snake.x = 0;
  if (snake.y < 0) snake.y = canvas.height - grid;
  if (snake.y >= canvas.height) snake.y = 0;

  snake.cells.unshift({ x: snake.x, y: snake.y });
  if (snake.cells.length > snake.maxCells) snake.cells.pop();

  ctx.fillStyle = "#ff4b4b";
  ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

  ctx.fillStyle = "#7dff7d";
  snake.cells.forEach((cell, index) => {
    ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;
      apple.x = random(0, 20) * grid;
      apple.y = random(0, 20) * grid;
    }

    for (let i = index + 1; i < snake.cells.length; i++) {
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        snake.x = 160; snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;
      }
    }
  });
}

document.addEventListener("keydown", e => {
  const keyToDir = {
    ArrowLeft: "left",
    ArrowUp: "up",
    ArrowRight: "right",
    ArrowDown: "down"
  };
  if (keyToDir[e.key]) setDirection(keyToDir[e.key]);
});

document.querySelectorAll("[data-dir]").forEach(btn => {
  const press = (evt) => {
    evt.preventDefault();
    setDirection(btn.dataset.dir);
  };
  btn.addEventListener("pointerdown", press);
  btn.addEventListener("click", press);
});

requestAnimationFrame(loop);
</script>
</body>
</html>
